name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Build HACS zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set manifest version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/gps_ntp/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/gps_ntp/manifest.json

      # Zip the folder contents, not the folder: HACS extracts the archive
      # into custom_components/gps_ntp/.
      - name: Zip integration
        run: |
          cd custom_components/gps_ntp
          zip -r ../../gps_ntp.zip . -x '*__pycache__*'

      - uses: softprops/action-gh-release@v2
        with:
          files: gps_ntp.zip
