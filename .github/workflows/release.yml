name: release

on:
  release:
    types: [published]
  # Manual run: attach the zip to an existing release without cutting a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach gps_ntp.zip to (e.g. v0.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  zip:
    name: Build HACS zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set manifest version from tag
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/gps_ntp/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/gps_ntp/manifest.json

      # Zip the folder contents, not the folder: HACS extracts the archive
      # into custom_components/gps_ntp/.
      - name: Zip integration
        run: |
          cd custom_components/gps_ntp
          zip -r ../../gps_ntp.zip . -x '*__pycache__*'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: gps_ntp.zip
